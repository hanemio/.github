name: Copilot Auto Fix (Reusable)

on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: number
      run_conclusion:
        required: true
        type: string
      run_event:
        required: true
        type: string
      run_html_url:
        required: true
        type: string
      head_sha:
        required: true
        type: string

jobs:
  request-copilot-fix:
    if: inputs.run_conclusion == 'failure' && inputs.run_event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Find PR and request Copilot fix
        uses: actions/github-script@v7
        with:
          script: |
            const runId = ${{ inputs.run_id }};
            const runUrl = '${{ inputs.run_html_url }}';

            // 失敗したジョブを取得
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            // PR番号を特定
            let prNumber = null;
            for (const job of jobs.jobs) {
              if (job.pull_requests?.length > 0) {
                prNumber = job.pull_requests[0].number;
                break;
              }
            }

            if (!prNumber) {
              // workflow_run の head_sha から PR を検索
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
              });
              const sha = '${{ inputs.head_sha }}';
              const matched = prs.find(p => p.head.sha === sha);
              if (matched) prNumber = matched.number;
            }

            if (!prNumber) {
              core.info('PR not found, skipping');
              return;
            }

            // 無限ループ防止: 最後のコミットが bot なら停止
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const lastAuthor = commits.at(-1)?.author?.login || '';
            if (lastAuthor.includes('copilot') || lastAuthor.includes('github-actions')) {
              core.info(`Last commit by ${lastAuthor}, skipping to avoid loop`);
              return;
            }

            // 重複コメント防止: 直近1時間以内に同じコメントがあればスキップ
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 10,
            });
            const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000);
            const recentAutofix = comments.find(c =>
              c.body.includes('<!-- copilot-autofix -->') &&
              new Date(c.created_at) > oneHourAgo
            );
            if (recentAutofix) {
              core.info('Recent autofix comment exists, skipping');
              return;
            }

            // 失敗ジョブ名を収集 (CodeQL等は除外)
            const ignoredJobs = ['CodeQL', 'Copilot', 'Dependabot'];
            const failedJobs = jobs.jobs
              .filter(j => j.conclusion === 'failure')
              .filter(j => !ignoredJobs.some(ig => j.name.includes(ig)))
              .map(j => `\`${j.name}\``);

            if (failedJobs.length === 0) {
              core.info('No actionable failed jobs, skipping');
              return;
            }

            const body = [
              '<!-- copilot-autofix -->',
              `@copilot CI が失敗しています。以下の失敗ジョブのログを確認し、この PR の変更に起因する問題を修正してください。`,
              '',
              `**失敗ジョブ:** ${failedJobs.join(', ')}`,
              `**ログ:** ${runUrl}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
            core.info(`Commented on PR #${prNumber}`);
